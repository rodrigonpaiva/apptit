name: Publish release containers

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact tag of an already published release
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - name: Prepare runner-local report paths
        run: |
          {
            echo "RELEASE_METADATA=$RUNNER_TEMP/release-metadata.json"
            echo "RELEASE_SOURCE=$GITHUB_WORKSPACE/source"
            echo "IMAGE_REPORT=$RUNNER_TEMP/images.json"
            echo "VALIDATION_REPORT=$RUNNER_TEMP/validation.json"
            echo "PUBLICATION_REPORT=$RUNNER_TEMP/publication.json"
          } >> "$GITHUB_ENV"
      - name: Check out publisher tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          path: publisher
          persist-credentials: false
      - name: Set up repository Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: publisher/.node-version
      - name: Resolve published release and immutable tag commit
        id: release
        run: node publisher/scripts/containers/release.mjs resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.release.outputs.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tagged files and Sprint 2 acceptance
        run: node publisher/scripts/containers/release.mjs verify
      - name: Build both images before any push
        env:
          VERSION: ${{ steps.release.outputs.tag }}
          REVISION: ${{ steps.release.outputs.sha }}
        run: node publisher/scripts/containers/build.mjs --source "$RELEASE_SOURCE" --version "$VERSION" --revision "$REVISION" --repository "$GITHUB_REPOSITORY" --report "$IMAGE_REPORT"
      - name: Validate both images with disposable synthetic data
        run: node publisher/scripts/containers/validate.mjs --source "$RELEASE_SOURCE" --images "$IMAGE_REPORT" --report "$VALIDATION_REPORT"
      - name: Publish private packages and record digests
        run: node publisher/scripts/containers/release.mjs publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Summarize execution status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "Release container job: $JOB_STATUS; requested tag: $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo 'Inspect the evidence artifact for build, validation and publication checkpoints. A failed job does not prove that no image was pushed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain sanitized evidence even after failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-container-evidence
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/release-metadata.json
            ${{ runner.temp }}/images.json*
            ${{ runner.temp }}/validation.json
            ${{ runner.temp }}/publication.json
