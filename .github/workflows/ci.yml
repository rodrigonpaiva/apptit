name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  branch-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node scripts/check-branch-policy.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NX_DAEMON: 'false'
      NX_ISOLATE_PLUGINS: 'false'
      NX_NO_CLOUD: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Check delivery traceability without local planning files
        run: node scripts/delivery-status.mjs --check
      - run: node scripts/setup-env.mjs
      - run: npm ci
      - run: npm run check
      - run: npm run infra:up
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run db:seed
      - run: npm run test:integration
      - run: npm run smoke
      - name: Install isolated browser for UI regression
        run: |
          npm install --prefix "$RUNNER_TEMP/ui-browser" --save-exact playwright@1.65.1
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/ui-browser/browsers" node "$RUNNER_TEMP/ui-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Exercise shared UI in the production web app
        run: PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/ui-browser/browsers" npm run test:ui -- "$RUNNER_TEMP/ui-browser/node_modules/playwright/index.mjs"
      - name: Retain UI regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-regression
          if-no-files-found: error
          path: .local/qa-ui/
      - name: Stop synthetic infrastructure
        if: always()
        run: npm run infra:down
